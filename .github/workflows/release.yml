name: Release

# Release pipeline. Runs automatically after a successful
# "Build and Publish Docker Image" run on main, or manually via dispatch.
#   1. Determines the release version — explicit input, or auto-calculated
#      from the latest v* tag + commit messages (conventional commits)
#   2. Bumps the app version (backend __version__ + frontend package.json)
#   3. Rotates CHANGELOG.md — the [Unreleased] section becomes the new version
#   4. Commits, tags vX.Y.Z, and pushes
#   5. Builds and pushes the Docker image tagged X.Y.Z + latest to GHCR
#   6. Creates a GitHub Release with the changelog section + auto-generated
#      notes, and attaches the Docker image tarball as an asset
#
# Note: the tag is pushed with GITHUB_TOKEN, which deliberately does NOT
# trigger other workflows (docker-publish.yml will not fire for it). That is
# why this workflow builds and pushes the image itself.

on:
  # Auto-release: fires after the image build succeeds on main. The version
  # is always auto-calculated in this mode (dispatch inputs are empty here).
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version without the leading v (leave empty to auto-calculate)'
        required: false
        type: string
      bump:
        description: 'Auto-calculation mode when version is empty'
        required: false
        default: auto
        type: choice
        options:
          - auto    # from commit messages: breaking→major, feat→minor, else patch
          - major
          - minor
          - patch

permissions:
  contents: write   # commit, tag, create release
  packages: write   # push image to GHCR

# Only one release at a time; queue (never cancel) — a cancelled release
# could leave a tag without its image or GitHub Release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # For chained runs, only release after a successful build; manual
    # dispatches always run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release version
        id: version
        run: |
          EXPLICIT="${{ inputs.version }}"
          # inputs are empty on workflow_run triggers — default to auto
          BUMP="${{ inputs.bump }}"
          BUMP="${BUMP:-auto}"

          # Latest released version (bare number), if any
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)

          if [ -n "$EXPLICIT" ]; then
            if [[ ! "$EXPLICIT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be semver like 2.1.0 (got '$EXPLICIT')"
              exit 1
            fi
            VERSION="$EXPLICIT"
            SOURCE="explicit input"
          else
            if [ -z "$LATEST" ]; then
              echo "::error::No existing v* tags to calculate from — provide an explicit version for the first release."
              exit 1
            fi
            if [ "$BUMP" = "auto" ]; then
              # Conventional-commit analysis of everything since the last tag
              SUBJECTS=$(git log --format=%s "v$LATEST..HEAD")
              BODIES=$(git log --format=%B "v$LATEST..HEAD")
              if [ -z "$SUBJECTS" ]; then
                echo "::error::No commits since v$LATEST — nothing to release."
                exit 1
              fi
              if echo "$BODIES" | grep -qE '^BREAKING CHANGE' || echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
                BUMP=major
              elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
                BUMP=minor
              else
                BUMP=patch
              fi
              echo "Auto-detected bump from commits since v$LATEST: $BUMP"
            fi
            IFS=. read -r MA MI PA <<< "$LATEST"
            case "$BUMP" in
              major) VERSION="$((MA+1)).0.0" ;;
              minor) VERSION="$MA.$((MI+1)).0" ;;
              patch) VERSION="$MA.$MI.$((PA+1))" ;;
            esac
            SOURCE="calculated ($BUMP bump from v$LATEST)"
          fi

          # Shared safety checks
          if git tag -l "v$VERSION" | grep -q .; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version $VERSION is not higher than the latest release $LATEST"
              exit 1
            fi
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "## Releasing v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Version source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Releasing v$VERSION ($SOURCE)"

      - name: Bump backend version
        run: sed -i 's/^__version__ = ".*"/__version__ = "${{ steps.version.outputs.value }}"/' backend/app/version.py

      - name: Bump frontend version
        working-directory: frontend
        run: npm pkg set version="${{ steps.version.outputs.value }}"

      # Guard against silent bump failures (pattern drift in main.py, etc.):
      # the image must never be published with a version other than the input.
      - name: Verify bumped versions match
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          APP_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/version.py)
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          echo "release=$VERSION  backend=$APP_VERSION  frontend=$PKG_VERSION"
          if [ "$VERSION" != "$APP_VERSION" ] || [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version bump failed — backend '$APP_VERSION' / frontend '$PKG_VERSION' do not match '$VERSION'"
            exit 1
          fi

      # Native install tarball: backend + prebuilt frontend, installed by
      # scripts/install.sh as a systemd service (Linux) or LaunchAgent
      # (macOS). Built before tagging so a broken build never leaves a tag
      # behind.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build native install tarball
        id: tarball
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          STAGE="dockradar-$VERSION"
          ASSET="dockradar-$VERSION.tar.gz"

          (cd frontend && yarn install --frozen-lockfile && yarn build)

          rm -rf dist-native && mkdir -p "dist-native/$STAGE/frontend"
          rsync -a \
            --exclude tests --exclude compose_files --exclude __pycache__ \
            --exclude requirements-dev.txt --exclude '*.log' --exclude .env \
            backend/ "dist-native/$STAGE/backend/"
          cp -r frontend/dist "dist-native/$STAGE/frontend/dist"
          cp -r packaging .env.example LICENSE README.md "dist-native/$STAGE/"
          cp scripts/install.sh scripts/uninstall.sh "dist-native/$STAGE/"
          echo "$VERSION" > "dist-native/$STAGE/VERSION"

          # Smoke test: the packaged backend installs, imports, and finds the
          # bundled frontend.
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet -r "dist-native/$STAGE/backend/requirements.txt"
          (cd "dist-native/$STAGE/backend" && COMPOSE_DIR=/tmp/smoke-compose \
            /tmp/smoke-venv/bin/python -c "import app.main as m; assert m.DIST.exists(), 'frontend/dist missing'; print('smoke test: native tarball ok')")

          tar -C dist-native -czf "$ASSET" "$STAGE"
          sha256sum "$ASSET" > "$ASSET.sha256"
          ls -lh "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Rotate CHANGELOG (Unreleased → new version)
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          LATEST="${{ steps.version.outputs.latest }}"
          REPO="${{ github.repository }}"
          DATE=$(date -u +%F)

          # Current [Unreleased] body: lines between its heading and the next "## [".
          awk '
            /^## \[Unreleased\]/ { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > unreleased_body.txt

          if grep -qE '\S' unreleased_body.txt; then
            # Manual notes present — use them verbatim.
            cp unreleased_body.txt section_body.txt
            echo "Using manual [Unreleased] notes."
          else
            # Auto-generate grouped bullets from conventional commits since the last tag.
            RANGE="v$LATEST..HEAD"
            subj() { git log --no-merges --format='%s' "$RANGE"; }
            ADDED=$(subj | grep -E '^feat(\([^)]*\))?:'  | sed -E 's/^feat(\([^)]*\))?: *//')
            FIXED=$(subj | grep -E '^fix(\([^)]*\))?:'   | sed -E 's/^fix(\([^)]*\))?: *//')
            CHANGED=$(subj | grep -viE '^(feat|fix)(\([^)]*\))?:' | grep -viE '^chore\(release\)' | sed -E 's/^[a-zA-Z]+(\([^)]*\))?: *//')
            : > section_body.txt
            add_group() {
              [ -n "$2" ] || return 0
              { printf '\n### %s\n' "$1"; printf '%s\n' "$2" | sed 's/^/- /'; } >> section_body.txt
            }
            add_group Added   "$ADDED"
            add_group Fixed   "$FIXED"
            add_group Changed "$CHANGED"
            grep -qE '\S' section_body.txt || printf '\n- Maintenance release.\n' >> section_body.txt
            echo "Auto-generated changelog from commits since v$LATEST:"; cat section_body.txt
          fi

          # Splice: keep [Unreleased] empty, move/insert the body under the new version heading.
          awk -v ver="$VERSION" -v date="$DATE" -v bodyfile="section_body.txt" '
            /^## \[Unreleased\]/ && !done {
              print "## [Unreleased]"; print "";
              print "## [" ver "] — " date;
              while ((getline line < bodyfile) > 0) print line;
              print "";
              done=1; skip=1; next
            }
            skip && /^## \[/ { skip=0 }
            skip { next }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          # Refresh compare links: repoint [Unreleased] and insert the new version link.
          awk -v ver="$VERSION" -v latest="$LATEST" -v repo="$REPO" '
            /^\[Unreleased\]:/ {
              print "[Unreleased]: https://github.com/" repo "/compare/v" ver "...HEAD"
              print "[" ver "]: https://github.com/" repo "/compare/v" latest "...v" ver
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          rm -f unreleased_body.txt section_body.txt

      - name: Extract release notes for this version
        run: |
          # index() avoids regex-escaping pitfalls with the [brackets]
          awk -v ver="${{ steps.version.outputs.value }}" '
            index($0, "## [" ver "]") == 1 { grab=1; next }
            grab && index($0, "## [") == 1 { exit }
            grab { print }
          ' CHANGELOG.md > notes_body.txt
          {
            echo "## Changes"
            echo ""
            if grep -qE '\S' notes_body.txt; then
              cat notes_body.txt
            else
              echo "_See auto-generated notes below._"
            fi
          } > RELEASE_NOTES.md
          rm -f notes_body.txt
          echo "--- release notes ---"; cat RELEASE_NOTES.md

      - name: Commit version bump and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/version.py frontend/package.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.value }}"
          git tag "v${{ steps.version.outputs.value }}"
          # --atomic: branch and tag land together or not at all — a rejected
          # branch push (main moved mid-run) must not leave an orphaned tag.
          git push --atomic origin HEAD "v${{ steps.version.outputs.value }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR must stay first — the export step below takes the first tag.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
            docker.io/ankityadavpurson/dockradar
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push versioned Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Attach the image itself to the release so it can be downloaded and
      # `docker load`-ed without registry access. (GitHub always adds the
      # "Source code" zip/tar.gz assets — those cannot be removed.)
      - name: Export Docker image as release asset
        id: export
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          ASSET="dockradar-${{ steps.version.outputs.value }}-docker-image.tar.gz"
          # build-push-action builds inside buildx; pull to get it into the local daemon
          docker pull "$IMAGE"

          # Smoke test: the backend must at least import inside the image —
          # catches broken Python that a build alone would never execute.
          docker run --rm "$IMAGE" python -c "import app.main; print('smoke test: app imports ok')"

          docker save "$IMAGE" | gzip > "$ASSET"
          ls -lh "$ASSET"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

          # Document both install paths in the release notes
          cat >> RELEASE_NOTES.md <<EOF

          ### Docker image
          \`\`\`bash
          docker pull $IMAGE
          # or from Docker Hub
          docker pull ankityadavpurson/dockradar:${{ steps.version.outputs.value }}
          \`\`\`
          Or download \`$ASSET\` from the assets below and load it offline:
          \`\`\`bash
          gunzip -c $ASSET | docker load
          \`\`\`
          > **Note:** the *Source code (zip / tar.gz)* entries are attached automatically by GitHub and are not needed to run DockRadar — download the \`.tar.gz\` Docker image above instead.

          ### Native install — Linux & macOS (no container)
          One installer detects the OS: a systemd service on Linux, a per-user LaunchAgent on macOS.
          \`\`\`bash
          # Linux — requires systemd, Python 3.10+ and Docker Engine
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/install.sh | sudo bash -s -- --version ${{ steps.version.outputs.value }}

          # macOS — run WITHOUT sudo; requires Python 3.10+ and Docker Desktop, OrbStack or Colima
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/install.sh | bash -s -- --version ${{ steps.version.outputs.value }}

          # Uninstall — Linux (use "bash" without sudo on macOS); add "-s -- --purge" to also delete config and data
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/uninstall.sh | sudo bash
          \`\`\`
          Uses \`${{ steps.tarball.outputs.asset }}\` from the assets below.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            ${{ steps.export.outputs.asset }}
            ${{ steps.tarball.outputs.asset }}
            ${{ steps.tarball.outputs.asset }}.sha256
            scripts/install.sh
            scripts/uninstall.sh
