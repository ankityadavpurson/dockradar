name: Deploy Landing Page

# Firebase Hosting for the site in landing/.
#   - push to main (landing/ changed) → live channel
#   - PR touching landing/            → temporary preview channel (URL posted on the PR)
# Needs the FIREBASE_SERVICE_ACCOUNT_DOCKRADAR repository secret (service account JSON);
# the project comes from landing/.firebaserc. See landing/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-deploy.yml'

concurrency:
  group: landing-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write         # preview deploys report a check run
      pull-requests: write  # preview deploys comment the URL on the PR
    # Secrets aren't exposed to PRs from forks, so skip those rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: landing/yarn.lock

      - name: Install dependencies
        working-directory: landing
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: landing
        run: yarn build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCKRADAR }}
          entryPoint: landing
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
