<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DockRadar</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <script>
      /* Resolve the theme before first paint to avoid a flash of the wrong theme. */
      (function () {
        try {
          var t = localStorage.getItem('dockradar_theme') || 'system';
          var resolved = (t === 'light' || t === 'dark')
            ? t
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.backgroundColor = resolved === 'light' ? '#f3f3f3' : '#202020';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
