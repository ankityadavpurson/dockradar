<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DockRadar</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <script>
      /* Resolve the theme before first paint to avoid a flash of the wrong theme. */
      (function () {
        try {
          var t = localStorage.getItem('dockradar_theme') || 'system';
          var resolved = (t === 'light' || t === 'dark')
            ? t
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.backgroundColor = resolved === 'light' ? '#f3f3f3' : '#202020';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Pre-React boot loader — shown until the JS bundle mounts and React
         replaces #root, so the page is never blank while loading. */
      #boot-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px; color: rgba(128,128,128,0.9);
      }
      #boot-loader .spin {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(128,128,128,0.25); border-top-color: rgba(128,128,128,0.9);
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <div class="spin"></div>
        <div>Loading DockRadar…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
